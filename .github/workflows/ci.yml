name: CI & Search Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medicine
          POSTGRES_PASSWORD: medicine_dev
          POSTGRES_DB: medicine_search
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: medicine-search-backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize PostgreSQL extensions
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U medicine -d medicine_search -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          docker exec ${{ job.services.postgres.id }} psql -U medicine -d medicine_search -c "CREATE EXTENSION IF NOT EXISTS fuzzystrmatch;"

      - name: Run database migrations & search index setup
        working-directory: medicine-search-backend
        env:
          DATABASE_URL: postgresql+asyncpg://medicine:medicine_dev@localhost:5432/medicine_search
        run: |
          python scripts/setup_db.py
          alembic upgrade head
          python scripts/build_search_index.py

      - name: Run test suite (Unit, Integration & Quality)
        working-directory: medicine-search-backend
        env:
          DATABASE_URL: postgresql+asyncpg://medicine:medicine_dev@localhost:5432/medicine_search
          ALLOW_TINY_FALLBACK: "true"
        run: |
          pytest -v

      - name: Run search benchmark
        working-directory: medicine-search-backend
        env:
          DATABASE_URL: postgresql+asyncpg://medicine:medicine_dev@localhost:5432/medicine_search
        run: |
          python -m scripts.benchmark_search --limit 10 --iterations 3 --output ci_benchmark_results.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: medicine-search-backend/ci_benchmark_results.json
