[project]
name = "medicine-search-backend"
version = "0.1.0"
description = "Fuzzy search API for Indian medicines"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "aiosqlite>=0.20.0",
    "psycopg[binary]",
    "uvicorn[standard]",
    "python-dotenv",
    "httpx",
    "greenlet",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

