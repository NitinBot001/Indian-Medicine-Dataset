services:
  db:
    image: postgres:16-alpine
    container_name: medicine_search_db
    environment:
      POSTGRES_DB: medicine_search
      POSTGRES_USER: medicine
      POSTGRES_PASSWORD: medicine_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicine -d medicine_search"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
